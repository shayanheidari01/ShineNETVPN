name: Build and Release APK

on:
  push:
    tags:
      - 'v*'

  workflow_dispatch:
    inputs:
      increment_version:
        description: 'Increment version type (patch, minor, major)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Switch to branch for commit
        run: |
          BRANCH=$(git branch -r --contains HEAD | head -1 | sed 's|origin/||' | xargs)
          git checkout -B "$BRANCH"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter Doctor
        run: |
          flutter --version
          flutter doctor -v

      - name: Clean Flutter
        run: flutter clean

      - name: Get dependencies
        run: flutter pub get

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libclang-dev ninja-build

      - name: Install Android NDK
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;28.2.13676358"

      - name: Build Aether native library
        env:
          NDK_VERSION: "28.2.13676358"
          API_LEVEL: "24"
        run: |
          NDK_DIR="$ANDROID_HOME/ndk/$NDK_VERSION"
          TOOLCHAIN="$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64"
          BASE_DIR="$GITHUB_WORKSPACE"
          SYSROOT="$TOOLCHAIN/sysroot"
          export CMAKE_GENERATOR=Ninja

          # Create symlinks so cc crate (used by ring) finds the compiler
          # NDK ships aarch64-linux-android24-clang but ring expects aarch64-linux-android-clang
          for triple in aarch64-linux-android armv7a-linux-androideabi x86_64-linux-android i686-linux-android; do
            for tool in clang clang++ ld.lld ar ranlib strip; do
              src="$TOOLCHAIN/bin/${triple}${API_LEVEL}-${tool}"
              dst="$TOOLCHAIN/bin/${triple}-${tool}"
              if [ -f "$src" ] && [ ! -f "$dst" ]; then
                ln -s "$(basename "$src")" "$dst"
              fi
            done
          done

          # Add NDK bin to PATH so cc crate finds the compiler
          export PATH="$TOOLCHAIN/bin:$PATH"

          set_abi_env() {
            # $1=RUST_TARGET, $2=CC_TRIPLE
            local TARGET_UPPER=$(echo "$1" | tr '[:lower:]-' '[:upper:]_')
            export "CARGO_TARGET_${TARGET_UPPER}_LINKER=${TOOLCHAIN}/bin/${2}${API_LEVEL}-clang"
            export "AR_${TARGET_UPPER}=${TOOLCHAIN}/bin/llvm-ar"
            export "CC_${TARGET_UPPER}=${TOOLCHAIN}/bin/${2}${API_LEVEL}-clang"
            export "CXX_${TARGET_UPPER}=${TOOLCHAIN}/bin/${2}${API_LEVEL}-clang++"
            export "CFLAGS_${TARGET_UPPER}=--target=${2}${API_LEVEL}"
            export "CXXFLAGS_${TARGET_UPPER}=--target=${2}${API_LEVEL}"
            export "BINDGEN_EXTRA_CLANG_ARGS_${TARGET_UPPER}=--target=${2}${API_LEVEL} --sysroot=${SYSROOT}"
          }

          unset_abi_env() {
            local TARGET_UPPER=$(echo "$1" | tr '[:lower:]-' '[:upper:]_')
            unset "CARGO_TARGET_${TARGET_UPPER}_LINKER" "AR_${TARGET_UPPER}" "CC_${TARGET_UPPER}" \
              "CXX_${TARGET_UPPER}" "CFLAGS_${TARGET_UPPER}" "CXXFLAGS_${TARGET_UPPER}" \
              "BINDGEN_EXTRA_CLANG_ARGS_${TARGET_UPPER}"
          }

          build_abi() {
            local ABI=$1
            local RUST_TARGET=$2
            local CC_TRIPLE=$3

            echo "========================================="
            echo "Building libaether.so for $ABI ($RUST_TARGET)"
            echo "========================================="

            set_abi_env "$RUST_TARGET" "$CC_TRIPLE"
            export RUSTFLAGS="-C link-arg=-Wl,-soname,libaether.so -C link-arg=-Wl,-z,max-page-size=16384 -C link-arg=-Wl,-z,common-page-size=16384"

            cd "$BASE_DIR/android/aether_core/aether"

            # Single pass: cargo-ndk handles everything including BoringSSL
            cargo ndk -t "$ABI" --platform "$API_LEVEL" build --release --lib

            # Copy to jniLibs
            DEST="$BASE_DIR/android/app/src/main/jniLibs/$ABI"
            mkdir -p "$DEST"
            cp "target/$RUST_TARGET/release/libaether.so" "$DEST/libaether.so"
            echo "Installed: $DEST/libaether.so"

            cd "$BASE_DIR"

            # Clean up env vars for next ABI
            unset RUSTFLAGS
            unset_abi_env "$RUST_TARGET"
          }

          build_abi "arm64-v8a" "aarch64-linux-android" "aarch64-linux-android"
          build_abi "armeabi-v7a" "armv7-linux-androideabi" "armv7a-linux-androideabi"
          build_abi "x86_64" "x86_64-linux-android" "x86_64-linux-android"

          echo "========================================="
          echo "All ABIs built:"
          ls -lh "$BASE_DIR/android/app/src/main/jniLibs/"*/libaether.so
          echo "========================================="

      - name: Extract current version from pubspec.yaml
        id: current_version
        run: |
          VERSION_LINE=$(grep '^version:' pubspec.yaml)
          VERSION_FULL=$(echo "$VERSION_LINE" | sed 's/version: //')
          VERSION_NAME=$(echo "$VERSION_FULL" | cut -d'+' -f1)
          BUILD_NUMBER=$(echo "$VERSION_FULL" | cut -d'+' -f2)

          MAJOR=$(echo "$VERSION_NAME" | cut -d'.' -f1)
          MINOR=$(echo "$VERSION_NAME" | cut -d'.' -f2)
          PATCH=$(echo "$VERSION_NAME" | cut -d'.' -f3)

          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "major=$MAJOR" >> $GITHUB_OUTPUT
          echo "minor=$MINOR" >> $GITHUB_OUTPUT
          echo "patch=$PATCH" >> $GITHUB_OUTPUT

      - name: Calculate new version
        id: new_version
        run: |
          MAJOR=${{ steps.current_version.outputs.major }}
          MINOR=${{ steps.current_version.outputs.minor }}
          PATCH=${{ steps.current_version.outputs.patch }}
          BUILD=${{ steps.current_version.outputs.build_number }}

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            case "${{ github.event.inputs.increment_version }}" in
              major)
                MAJOR=$((MAJOR + 1))
                MINOR=0
                PATCH=0
                ;;
              minor)
                MINOR=$((MINOR + 1))
                PATCH=0
                ;;
              patch)
                PATCH=$((PATCH + 1))
                ;;
            esac
          fi

          BUILD=$((BUILD + 1))

          NEW_VERSION="$MAJOR.$MINOR.$PATCH"

          echo "new_version_name=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "new_build_number=$BUILD" >> $GITHUB_OUTPUT

      - name: Update pubspec.yaml
        run: |
          sed -i "s/^version: .*/version: ${{ steps.new_version.outputs.new_version_name }}+${{ steps.new_version.outputs.new_build_number }}/" pubspec.yaml

      - name: Commit version update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add pubspec.yaml

          git diff --cached --quiet || \
          git commit -m "Bump version to ${{ steps.new_version.outputs.new_version_name }}+${{ steps.new_version.outputs.new_build_number }} [skip ci]"

          git pull origin main --rebase
          git push origin HEAD:main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/keystore.jks
          chmod 600 android/app/keystore.jks

      - name: Create key.properties
        env:
          KEYALIAS: ${{ secrets.KEYALIAS }}
          KEYPASSWORD: ${{ secrets.KEYPASSWORD }}
          STOREPASSWORD: ${{ secrets.STOREPASSWORD }}
        run: |
          cat > android/key.properties << EOF
          keyAlias=$KEYALIAS
          keyPassword=$KEYPASSWORD
          storePassword=$STOREPASSWORD
          storeFile=keystore.jks
          EOF

          chmod 600 android/key.properties

      - name: Build Split APKs per ABI
        run: |
          flutter build apk --release --split-per-abi \
            --build-name=${{ steps.new_version.outputs.new_version_name }} \
            --build-number=${{ steps.new_version.outputs.new_build_number }}

      - name: Build Universal APK
        run: |
          flutter build apk --release \
            --build-name=${{ steps.new_version.outputs.new_version_name }} \
            --build-number=${{ steps.new_version.outputs.new_build_number }}

      - name: Rename APK files
        id: rename
        run: |
          VERSION="${{ steps.new_version.outputs.new_version_name }}"
          BUILD="${{ steps.new_version.outputs.new_build_number }}"
          OUTPUT_DIR="build/app/outputs/flutter-apk"
          RELEASE_DIR="release-assets"
          mkdir -p "$RELEASE_DIR"

          cd "$OUTPUT_DIR"

          for APK in app-*-release.apk; do
            ABI=$(echo "$APK" | sed 's/app-//;s/-release.apk//')
            NEW_NAME="ShineNET_v${VERSION}_${BUILD}_${ABI}.apk"
            cp "$APK" "../../../../$RELEASE_DIR/$NEW_NAME"
            echo "Built: $NEW_NAME"
          done

          # Copy universal APK
          cp app-release.apk "../../../../$RELEASE_DIR/ShineNET_v${VERSION}_${BUILD}_universal.apk"
          echo "Built: ShineNET_v${VERSION}_${BUILD}_universal.apk"

          cd ../../../..
          ls -lh "$RELEASE_DIR/"

      - name: Generate SHA256 checksums
        run: |
          cd release-assets
          sha256sum *.apk > SHA256_Checksums.txt
          echo "--- Checksums ---"
          cat SHA256_Checksums.txt

      - name: Cleanup secrets
        if: always()
        run: |
          rm -f android/app/keystore.jks
          rm -f android/key.properties

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.new_version.outputs.new_version_name }}+${{ steps.new_version.outputs.new_build_number }}
          name: ShineNET VPN v${{ steps.new_version.outputs.new_version_name }}
          files: |
            release-assets/*.apk
            release-assets/SHA256_Checksums.txt
          draft: false
          prerelease: false
          body: |
            ## ShineNET VPN v${{ steps.new_version.outputs.new_version_name }}

            ### Downloads
            | File | Architecture | Description |
            |------|-------------|-------------|
            | `ShineNET_v${{ steps.new_version.outputs.new_version_name }}_${{ steps.new_version.outputs.new_build_number }}_universal.apk` | All | Universal APK for all architectures (recommended) |
            | `ShineNET_v${{ steps.new_version.outputs.new_version_name }}_${{ steps.new_version.outputs.new_build_number }}_arm64-v8a.apk` | ARM 64-bit | For most modern Android devices |
            | `ShineNET_v${{ steps.new_version.outputs.new_version_name }}_${{ steps.new_version.outputs.new_build_number }}_armeabi-v7a.apk` | ARM 32-bit | For older Android devices |
            | `ShineNET_v${{ steps.new_version.outputs.new_version_name }}_${{ steps.new_version.outputs.new_build_number }}_x86_64.apk` | x86_64 | For emulators and Chromebooks |

            > **Tip:** Use the **universal APK** for easy installation on any device. For smaller file size, download the APK matching your device architecture. Check `SHA256_Checksums.txt` to verify file integrity.

            ### Build Info
            - **Version:** ${{ steps.new_version.outputs.new_version_name }}
            - **Build Number:** ${{ steps.new_version.outputs.new_build_number }}
            - **Flutter Channel:** stable

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ShineNET-APKs
          path: release-assets/*.apk
          retention-days: 30
